<!doctype html>
<html lang="en" data-bs-theme="light"> <!-- Add theme attribute here -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sijey Place Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" href="pics/logo_profile.png" type="image/png">
</head>

<body style="margin:0; font-family:sans-serif;">

  <!--WRAPPER FOR BACKGROUND-->
  <div id="contentWrapper"
    style="min-height:100vh; background:url('pics/fuji_morning.jpg') no-repeat center center fixed; background-size:cover; transition: all 0.5s;">

    <!--NAVBAR-->
    <div class="container-fluid position-sticky top-0 p-0 p-lg-3 z-1">
      <div class="container-xl p-0">
        <div class="navigation shadow-sm p-4 px-xl-5 poppins rounded-5 border-bottom"
          style="background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(1px); border: 1px solid rgba(255,255,255,0.3); transition: all 0.5s;">
          <div class="d-flex flex-column flex-lg-row justify-content-between align-items-center">

            <!-- Brand (Logo + Text) -->
            <div class="d-flex align-items-center">
              <a href="https://sijey-cjaa.github.io/" target="_blank" style="text-decoration:none;">
                <img src="pics/logo_profile.png" alt="CJ's Profile Logo"
                  style="height:90px; width:90px; border-radius:15px; object-fit:cover;">
              </a>
              <a href="https://sijey-cjaa.github.io/" target="_blank" style="text-decoration:none;">
                <img src="pics/japan_logo.png" alt="JAPAN Logo"
                  style="height:90px; width:90px; border-radius:15px; object-fit:cover;">
              </a>
              <div class="fw-bold fs-4 text-black ms-3">JAPAN</div> <!-- adaptive text -->
            </div>

            <!-- Navigation Links -->
            <div class="d-flex flex-row mt-4 mt-lg-0 flex-wrap justify-content-center align-items-center text-black">
              <a href="#" class="nav-link"><small>Home</small></a>
              <!-- Night Mode Toggle -->
              <button id="modeToggle"
                class="btn btn-sm ms-3 ms-md-4 px-3 py-1 fw-semibold text-light border-0"
                style="background-color:#0078d7; border-radius:20px;">🌙 Night</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TITLE -->
    <div class="container my-5 p-5 text-center fst-italic">
      <div class="row">
        <div class="col-lg-12">
          <h1 class="display-4 fw-semibold mb-3 text-body">Welcome to my place showcase</h1>
          <p class="lead mb-0 text-body">Let's explore the places I want to showcase in Japan</p>
        </div>
      </div>
    </div>

  </div> <!-- END CONTENT WRAPPER -->

  <!--FOOTER-->
  <div class="container-fluid p-3 shadow-sm text-center border-top"
    style="background-color:#f8f9fa; position:relative; z-index:1;">
    <div class="row">
      <div class="col">
        <div class="my-4 text-primary">
          Made with love, dedication, and a touch of creativity.<br>
          <small>Gusto kona pumunta sa Japan</small>
        </div>
        <div class="mt-5 text-black">sijey artuz</div>
      </div>
    </div>
  </div>

  <!--JS: Night/Light Mode Toggle-->
  <script>
    const button = document.getElementById('modeToggle');
    const wrapper = document.getElementById('contentWrapper');
    const html = document.documentElement;

    // Load previous preference
    if (localStorage.getItem('theme') === 'dark') {
      html.setAttribute('data-bs-theme', 'dark');
      wrapper.style.background = "url('pics/fuji_night.jpg') no-repeat center center fixed";
      wrapper.style.backgroundSize = "cover";
      button.textContent = '☀️ Light';
    }

    button.addEventListener('click', () => {
      if (html.getAttribute('data-bs-theme') === 'light') {
        html.setAttribute('data-bs-theme', 'dark');
        wrapper.style.background = "url('pics/fuji_night.jpg') no-repeat center center fixed";
        wrapper.style.backgroundSize = "cover";
        button.textContent = '☀️ Light';
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-bs-theme', 'light');
        wrapper.style.background = "url('pics/fuji_morning.jpg') no-repeat center center fixed";
        wrapper.style.backgroundSize = "cover";
        button.textContent = '🌙 Night';
        localStorage.setItem('theme', 'light');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
