  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- JS FOR MODE & SOUND -->
  <script>
    const modeToggle = document.getElementById("modeToggle");
    const footer = document.getElementById("footer");
    const navbar = document.getElementById("navbar");
    const video = document.getElementById("bg-video");
    const toggleVolume = document.getElementById("toggleVolume");
    let darkMode = false;

    modeToggle.addEventListener("click", () => {
      darkMode = !darkMode;
      if (darkMode) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
        modeToggle.textContent = "☀️ Light";
        modeToggle.style.backgroundColor = "#ffc107";

        // Dark Mode Navbar + Footer
        navbar.style.background = "rgba(33,37,41,0.85)";
        navbar.style.border = "1px solid rgba(255,255,255,0.15)";
        footer.style.background = "rgba(33,37,41,0.85)";
        footer.style.color = "#f8f9fa";
        footer.style.borderTop = "1px solid rgba(255,255,255,0.15)";
      } else {
        document.documentElement.setAttribute("data-bs-theme", "light");
        modeToggle.textContent = "🌙 Night";
        modeToggle.style.backgroundColor = "#0078d7";

        // Light Mode Navbar + Footer
        navbar.style.background = "rgba(255,255,255,0.6)";
        navbar.style.border = "1px solid rgba(255,255,255,0.3)";
        footer.style.background = "rgba(255,255,255,0.6)";
        footer.style.color = "#000";
        footer.style.borderTop = "1px solid rgba(255,255,255,0.3)";
      }
    });

    toggleVolume.addEventListener("click", () => {
      if (video.muted) {
        video.muted = false;
        toggleVolume.textContent = "🔊 Sound On";
        toggleVolume.style.backgroundColor = "#28a745";
      } else {
        video.muted = true;
        toggleVolume.textContent = "🔇 Mute";
        toggleVolume.style.backgroundColor = "#6c757d";
      }
    });
  </script>
</body>
