<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WONDERS OF JAPAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="icon" type="image/png" href="pics/logo_profile.png">
  </head>

  <body class="m-0 p-0 position-relative" style="overflow-x:hidden;">

    <!-- Background Video -->
    <video id="bg-video" autoplay loop muted playsinline
      style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1;">
      <source src="vids/explore_japan.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- NAVBAR -->
    <div class="container-fluid position-sticky top-0 p-0 p-lg-3" style="z-index:999;">
      <div class="container-xl p-0">
        <div id="navbar" class="shadow-sm p-4 px-xl-5 rounded-5 border-bottom d-flex flex-column flex-lg-row justify-content-between align-items-center"
          style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">

          <!-- BRAND SECTION -->
          <div class="d-flex align-items-center">
            <a href="https://sijey-cjaa.github.io/" target="_blank" class="text-decoration-none me-2">
              <img src="pics/logo_profile.png" alt="CJ's Profile Logo"
                class="rounded-4" style="height:85px; width:85px; object-fit:cover;">
            </a>

            <a href="https://sijey-cjaa.github.io/sijey-place-showcase/" target="_blank" class="text-decoration-none me-2">
              <img src="pics/japan_logo.png" alt="Japan Logo"
                class="rounded-4" style="height:85px; width:85px; object-fit:cover;">
            </a>

            <div class="d-flex flex-column ms-2" style="line-height:1.2;">
              <span class="fw-bold fs-3 text-body">JAPAN</span>
              <small class="text-body">Showcase</small>
            </div>
          </div>

          <!-- NAV BUTTONS -->
          <div class="d-flex flex-row mt-3 mt-lg-0 align-items-center justify-content-center flex-wrap" style="gap:.6rem;">
            <a href="#" class="text-body text-decoration-none fw-semibold"><small>Home</small></a>

            <button id="toggleVolume" type="button"
              class="btn btn-sm px-3 py-1 fw-semibold border-0"
              style="background-color:#6c757d; border-radius:20px; color:white;">🔇 Mute</button>

            <button id="modeToggle" type="button"
              class="btn btn-sm px-3 py-1 fw-semibold border-0 text-light"
              style="background-color:#0078d7; border-radius:20px;">🌙 Night</button>
          </div>
        </div>
      </div>
    </div>

    <!-- HERO SECTION -->
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center text-center text-light"
      style="min-height:100vh; padding-top:6rem;">
      <h1 class="fw-bold display-3 mb-3" style="text-shadow:0 2px 10px rgba(0,0,0,0.6);">Explore my 6 go-to Wonders of Japan</h1>
      <p class="lead mb-4" style="max-width:700px; text-shadow:0 1px 5px rgba(0,0,0,0.5);">
        Discover the harmony of tradition and innovation through Japan’s timeless beauty.
      </p>
      <a href="#learnmore" class="btn btn-lg fw-semibold px-4 py-2"
        style="border-radius:30px; background-color:#0078d7; color:white;">Learn More</a>
    </div>

    <!-- FOOTER -->
    <footer id="footer" class="text-center py-4 w-100 fw-semibold"
      style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); color:#000; border-top:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">
      <p class="mb-1">Made with love</p>
      <p class="mb-0">sijey artuz</p>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- JS FOR MODE & SOUND -->
    <script>
      const modeToggle = document.getElementById("modeToggle");
      const footer = document.getElementById("footer");
      const navbar = document.getElementById("navbar");
      const video = document.getElementById("bg-video");
      const toggleVolume = document.getElementById("toggleVolume");
      let darkMode = false;

      modeToggle.addEventListener("click", () => {
        darkMode = !darkMode;
        if (darkMode) {
          document.documentElement.setAttribute("data-bs-theme", "dark");
          modeToggle.textContent = "☀️ Light";
          modeToggle.style.backgroundColor = "#ffc107";

          // Dark Mode Navbar + Footer
          navbar.style.background = "rgba(33,37,41,0.85)";
          navbar.style.border = "1px solid rgba(255,255,255,0.15)";
          footer.style.background = "rgba(33,37,41,0.85)";
          footer.style.color = "#f8f9fa";
          footer.style.borderTop = "1px solid rgba(255,255,255,0.15)";
        } else {
          document.documentElement.setAttribute("data-bs-theme", "light");
          modeToggle.textContent = "🌙 Night";
          modeToggle.style.backgroundColor = "#0078d7";

          // Light Mode Navbar + Footer
          navbar.style.background = "rgba(255,255,255,0.6)";
          navbar.style.border = "1px solid rgba(255,255,255,0.3)";
          footer.style.background = "rgba(255,255,255,0.6)";
          footer.style.color = "#000";
          footer.style.borderTop = "1px solid rgba(255,255,255,0.3)";
        }
      });

      toggleVolume.addEventListener("click", () => {
        if (video.muted) {
          video.muted = false;
          toggleVolume.textContent = "🔊 Sound On";
          toggleVolume.style.backgroundColor = "#28a745";
        } else {
          video.muted = true;
          toggleVolume.textContent = "🔇 Mute";
          toggleVolume.style.backgroundColor = "#6c757d";
        }
      });
    </script>
  </body>
</html>
