<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOUNT FUJI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="pics/logo_profile.png">
</head>

<body class="m-0 p-0 position-relative" style="overflow-x:hidden;">

  <!-- Background Video -->
  <video id="bg-video" autoplay loop playsinline muted
    style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1;">
    <source src="vids/mountFuji.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- NAVBAR -->
  <div class="container-fluid position-sticky top-0 p-0 p-lg-3" style="z-index:999;">
    <div class="container-xl p-0">
      <div id="navbar"
        class="shadow-sm p-4 px-xl-5 rounded-5 border-bottom d-flex flex-column flex-lg-row justify-content-between align-items-center"
        style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">

        <!-- BRAND -->
        <div class="d-flex align-items-center">
          <a href="https://sijey-cjaa.github.io/" class="text-decoration-none me-2">
            <img src="pics/logo_profile.png" alt="CJ's Profile Logo" class="rounded-4"
              style="height:85px; width:85px; object-fit:cover;">
          </a>

          <a href="https://sijey-cjaa.github.io/sijey-place-showcase/" class="text-decoration-none me-2">
            <img src="pics/japan_logo.png" alt="Japan Logo" class="rounded-4"
              style="height:85px; width:85px; object-fit:cover;">
          </a>

          <a href="https://sijey-cjaa.github.io/sijey-place-showcase/explore.html" class="text-decoration-none me-2">
            <div class="d-flex flex-column ms-2" style="line-height:1.2;">
              <span class="fw-bold fs-3 text-body">MOUNT FUJI</span>
              <small class="text-body">CJ ARTUZ SHOWCASE</small>
            </div>
          </a>
        </div>

        <!-- BUTTONS -->
        <div class="d-flex flex-row mt-3 mt-lg-0 align-items-center justify-content-center flex-wrap"
          style="gap:.6rem;">
          <a href="#" class="text-body text-decoration-none fw-semibold"><small>Home</small></a>

          <button id="toggleVolume" type="button" class="btn btn-sm px-3 py-1 fw-semibold border-0"
            style="background-color:#6c757d; border-radius:20px; color:white;">🔇 Muted</button>

          <button id="modeToggle" type="button" class="btn btn-sm px-3 py-1 fw-semibold border-0 text-light"
            style="background-color:#0078d7; border-radius:20px;">🌙 Night</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TITLE SECTION -->
  <div class="container-fluid d-flex justify-content-center align-items-center text-center fst-italic text-white"
    style="min-height:75vh; position:relative;">
    <h1 class="fw-bold display-3" style="text-shadow:2px 2px 4px rgba(0,0,0,0.7);">MOUNT FUJI</h1>
  </div>

  <!-- MOUNT FUJI SHOWCASE SECTION -->
  <div class="container my-5 p-4 rounded-4 shadow-sm">
    <div class="row align-items-center">
      <div class="col-lg-6 mb-4 mb-lg-0">
        <img id="fujiShowcaseImg" src="pics/fuji_morning1.jpg" alt="Mount Fuji Morning Image"
          class="img-fluid rounded-4 shadow-sm w-100" style="object-fit:cover;">
      </div>
      <div class="col-lg-6">
        <div class="p-4 rounded-4 bg-body bg-opacity-75 shadow-sm">
          <h2 id="fujiShowcaseTitle" class="fw-bold">Mount Fuji in the Morning</h2>
          <p id="fujiShowcaseText">
            The iconic peak rises majestically above the surrounding landscape, bathed in soft morning light.
            Visitors can enjoy serene lakes, scenic trails, and the calm atmosphere of early morning Japan.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footer" class="text-center py-4 w-100 fw-semibold"
    style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); color:#000; border-top:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">
    <p class="mb-1">Made with love</p>
    <p class="mb-0">sijey artuz</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    const modeToggle = document.getElementById("modeToggle");
    const footer = document.getElementById("footer");
    const navbar = document.getElementById("navbar");
    const toggleVolume = document.getElementById("toggleVolume");
    const video = document.getElementById("bg-video");
    const showcaseImg = document.getElementById("fujiShowcaseImg");
    const showcaseTitle = document.getElementById("fujiShowcaseTitle");
    const showcaseText = document.getElementById("fujiShowcaseText");

    let darkMode = false;

    // Start muted
    video.muted = true;
    toggleVolume.textContent = "🔇 Muted";

    // Toggle volume
    toggleVolume.addEventListener("click", () => {
      video.muted = !video.muted;
      if (video.muted) {
        toggleVolume.textContent = "🔇 Muted";
        toggleVolume.style.backgroundColor = "#6c757d";
      } else {
        toggleVolume.textContent = "🔊 Sound On";
        toggleVolume.style.backgroundColor = "#28a745";
      }
    });

    // Toggle dark/light mode
    modeToggle.addEventListener("click", () => {
      darkMode = !darkMode;

      if (darkMode) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
        modeToggle.textContent = "☀️ Light";
        modeToggle.style.backgroundColor = "#ffc107";

        navbar.style.background = "rgba(33,37,41,0.85)";
        navbar.style.border = "1px solid rgba(255,255,255,0.15)";
        footer.style.background = "rgba(33,37,41,0.85)";
        footer.style.color = "#f8f9fa";
        footer.style.borderTop = "1px solid rgba(255,255,255,0.15)";

        showcaseImg.src = "pics/fuji_night.jpg";
        showcaseTitle.textContent = "Mount Fuji at Night";
        showcaseText.textContent = "As the sun sets, Mount Fuji casts a magnificent silhouette against the starry sky. Lights from nearby towns twinkle, creating a magical nighttime scene.";
      } else {
        document.documentElement.setAttribute("data-bs-theme", "light");
        modeToggle.textContent = "🌙 Night";
        modeToggle.style.backgroundColor = "#0078d7";

        navbar.style.background = "rgba(255,255,255,0.6)";
        navbar.style.border = "1px solid rgba(255,255,255,0.3)";
        footer.style.background = "rgba(255,255,255,0.6)";
        footer.style.color = "#000";
        footer.style.borderTop = "1px solid rgba(255,255,255,0.3)";

        showcaseImg.src = "pics/fuji_morning1.jpg";
        showcaseTitle.textContent = "Mount Fuji in the Morning";
        showcaseText.textContent = "The iconic peak rises majestically above the surrounding landscape, bathed in soft morning light. Visitors can enjoy serene lakes, scenic trails, and the calm atmosphere of early morning Japan.";
      }
    });
  </script>
</body>

</html>
