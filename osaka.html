<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSAKA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="pics/logo_profile.png">
</head>

<body class="m-0 p-0 position-relative" style="overflow-x:hidden;">

    <!-- Background Video -->
    <video id="bg-video" autoplay loop playsinline muted
        style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1;">
        <source src="vids/osaka.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- NAVBAR -->
    <div class="container-fluid position-sticky top-0 p-0 p-lg-3" style="z-index:999;">
        <div class="container-xl p-0">
            <div id="navbar"
                class="shadow-sm p-4 px-xl-5 rounded-5 border-bottom d-flex flex-column flex-lg-row justify-content-between align-items-center"
                style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">

                <!-- BRAND -->
                <div class="d-flex align-items-center">
                    <a href="https://sijey-cjaa.github.io/" class="text-decoration-none me-2">
                        <img src="pics/logo_profile.png" alt="CJ's Profile Logo" class="rounded-4"
                            style="height:85px; width:85px; object-fit:cover;">
                    </a>

                    <a href="https://sijey-cjaa.github.io/sijey-place-showcase/" class="text-decoration-none me-2">
                        <img src="pics/japan_logo.png" alt="Japan Logo" class="rounded-4"
                            style="height:85px; width:85px; object-fit:cover;">
                    </a>

                    <a href="https://sijey-cjaa.github.io/sijey-place-showcase/explore.html"
                        class="text-decoration-none me-2">
                        <div class="d-flex flex-column ms-2" style="line-height:1.2;">
                            <span class="fw-bold fs-3 text-body">OSAKA</span>
                            <small class="text-body">CJ ARTUZ SHOWCASE</small>
                        </div>
                    </a>
                </div>

                <!-- BUTTONS -->
                <div class="d-flex flex-row mt-3 mt-lg-0 align-items-center justify-content-center flex-wrap"
                    style="gap:.6rem;">
                    <a href="#" class="text-body text-decoration-none fw-semibold"><small>Home</small></a>

                    <button id="toggleVolume" type="button" class="btn btn-sm px-3 py-1 fw-semibold border-0"
                        style="background-color:#28a745; border-radius:20px; color:white;">🔊 Sound On</button>

                    <button id="modeToggle" type="button" class="btn btn-sm px-3 py-1 fw-semibold border-0 text-light"
                        style="background-color:#0078d7; border-radius:20px;">🌙 Night</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TITLE SECTION -->
    <div class="container-fluid d-flex justify-content-center align-items-center text-center fst-italic text-white"
        style="min-height:75vh; position:relative;">
        <h1 class="fw-bold display-3" style="text-shadow:2px 2px 4px rgba(0,0,0,0.7);">OSAKA</h1>
    </div>

    <!-- osaka SHOWCASE SECTION -->
    <div class="container my-5 p-4 rounded-4 shadow-sm">
        <div class="row align-items-center">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <img id="osakaShowcaseImg" src="pics/osaka_day.jpg" alt="Osaka Day Image"
                    class="img-fluid rounded-4 shadow-sm w-100" style="object-fit:cover;">
            </div>
            <div class="col-lg-6">
                <div class="p-4 rounded-4 bg-body bg-opacity-75 shadow-sm">
                    <h2 id="osakaShowcaseTitle" class="fw-bold">Osaka in the Morning</h2>
                    <p id="osakaShowcaseText">
                        The city wakes up with bustling streets, soft sunlight reflecting off skyscrapers, and a serene
                        atmosphere
                        along the Sumida River. Morning markets and cafés come alive with energy.
                    </p>
                </div>
            </div>
        </div>
    </div>


    <!-- FOOTER  -->
    <footer id="footer" class="text-center py-4 w-100 fw-semibold"
        style="background:rgba(255,255,255,0.6); backdrop-filter:blur(10px); color:#000; border-top:1px solid rgba(255,255,255,0.3); transition:all 0.5s;">
        <p class="mb-1">Made with love</p>
        <p class="mb-0">sijey artuz</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const modeToggle = document.getElementById("modeToggle");
        const footer = document.getElementById("footer");
        const navbar = document.getElementById("navbar");
        const video = document.getElementById("bg-video");
        const toggleVolume = document.getElementById("toggleVolume");
        let darkMode = false;

        const showcaseImg = document.getElementById("osakaShowcaseImg");
        const showcaseTitle = document.getElementById("osakaShowcaseTitle");
        const showcaseText = document.getElementById("osakaShowcaseText");

        video.muted = false;
        toggleVolume.textContent = "🔊 Sound On";
        toggleVolume.style.backgroundColor = "#28a745";

        modeToggle.addEventListener("click", () => {
            darkMode = !darkMode;
            if (darkMode) {
                document.documentElement.setAttribute("data-bs-theme", "dark");
                modeToggle.textContent = "☀️ Light";
                modeToggle.style.backgroundColor = "#ffc107";
                navbar.style.background = "rgba(33,37,41,0.85)";
                navbar.style.border = "1px solid rgba(255,255,255,0.15)";
                footer.style.background = "rgba(33,37,41,0.85)";
                footer.style.color = "#f8f9fa";
                footer.style.borderTop = "1px solid rgba(255,255,255,0.15)";

                showcaseImg.src = "pics/osaka_night.jpg";
                showcaseTitle.textContent = "Osaka at Night";
                showcaseText.textContent = "The city lights sparkle as Osaka transforms into a dazzling nightscape. Neon signs glow, nightlife awakens, and the streets are alive with energy.";
            } else {
                document.documentElement.setAttribute("data-bs-theme", "light");
                modeToggle.textContent = "🌙 Night";
                modeToggle.style.backgroundColor = "#0078d7";
                navbar.style.background = "rgba(255,255,255,0.6)";
                navbar.style.border = "1px solid rgba(255,255,255,0.3)";
                footer.style.background = "rgba(255,255,255,0.6)";
                footer.style.color = "#000";
                footer.style.borderTop = "1px solid rgba(255,255,255,0.3)";

                showcaseImg.src = "pics/osaka_day.jpg";
                showcaseTitle.textContent = "Osaka in the Morning";
                showcaseText.textContent = "The city wakes up with bustling streets, soft sunlight reflecting off skyscrapers, and a serene atmosphere along the Sumida River. Morning markets and cafés come alive with energy.";
            }
        });

        toggleVolume.addEventListener("click", () => {
            if (video.muted) {
                video.muted = false;
                toggleVolume.textContent = "🔊 Sound On";
                toggleVolume.style.backgroundColor = "#28a745";
            } else {
                video.muted = true;
                toggleVolume.textContent = "🔇 Mute";
                toggleVolume.style.backgroundColor = "#6c757d";
            }
        });
    </script>
</body>

</html>
